---
grails:
    profile: web
    codegen:
        defaultPackage: car.rental

    controllers:
        upload:
            maxFileSize: 10485760
            maxRequestSize: 52428800

    gorm:
        reactor:
            events: false

info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'

spring:
    jmx:
        unique-names: true
    main:
        banner-mode: "off"
    groovy:
        template:
            check-template-location: false
    devtools:
        restart:
            additional-exclude:
                - '*.gsp'
                - '**/*.gsp'
                - '*.gson'
                - '**/*.gson'
                - 'logback-spring.xml'
                - '*.properties'

environments:
    development:
        management:
            endpoints:
                enabled-by-default: true
                web:
                    base-path: '/actuator'
                    exposure:
                        include: '*'

    production:
        management:
            endpoints:
                enabled-by-default: false

---
grails:
    mime:
        disable:
            accept:
                header:
                    userAgents:
                        - Gecko
                        - WebKit
                        - Presto
                        - Trident

        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded

            html:
                - text/html
                - application/xhtml+xml

            js: text/javascript

            json:
                - application/json
                - text/json

            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain

            hal:
                - application/hal+json
                - application/hal+xml

            xml:
                - text/xml
                - application/xml

    urlmapping:
        cache:
            maxsize: 1000

    controllers:
        defaultScope: singleton

    converters:
        encoding: UTF-8

    views:
        default:
            codec: html

        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                expression: html
                scriptlet: html
                taglib: none
                staticparts: none

---
hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false

dataSource:
    pooled: true
    jmxExport: true
    dbCreate: update
    driverClassName: com.mysql.cj.jdbc.Driver
    dialect: org.hibernate.dialect.MySQL8Dialect
    url: 'jdbc:mysql://172.26.192.1:3306/car_rental?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
    username: car_rental_user
    password: 'car12345'

environments:
    test:
        dataSource:
            dbCreate: update
            driverClassName: org.h2.Driver
            dialect: org.hibernate.dialect.H2Dialect
            url: 'jdbc:h2:mem:testDb;MODE=MySQL;NON_KEYWORDS=USER,ROLE,YEAR;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE'
            password: ''

    production:
        dataSource:
            dbCreate: none
            driverClassName: org.h2.Driver
            url: 'jdbc:h2:./prodDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE'
            username: sa
            password: ''
            properties:
                jmxEnabled: true
                initialSize: 5
                maxActive: 50
                minIdle: 5
                maxIdle: 25
                maxWait: 10000
                maxAge: 600000
                timeBetweenEvictionRunsMillis: 5000
                minEvictableIdleTimeMillis: 60000
                validationQuery: SELECT 1
                validationQueryTimeout: 3
                validationInterval: 15000
                testOnBorrow: true
                testWhileIdle: true
                testOnReturn: false
                jdbcInterceptors: ConnectionState
                defaultTransactionIsolation: 2
